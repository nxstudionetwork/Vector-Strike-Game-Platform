# Local PostgreSQL for development.
#   docker compose up -d db
#   then in backend/.env: DATABASE_URL=postgres://vectorstrike:vectorstrike@localhost:5432/vectorstrike
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vectorstrike
      POSTGRES_USER: vectorstrike
      POSTGRES_PASSWORD: vectorstrike
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorstrike"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
